<body>
<title>Carrière Territoriale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout : app iPhone une colonne — grand titre, cartes groupées façon Réglages iOS, barre d'onglets fixe en bas. */
:root{
  --bg:#f2f3f8; --surface:#ffffff; --surface-2:#f7f8fc; --ink:#141829; --muted:#61677d; --line:#e0e3ee;
  --accent:#2944c2; --accent-ink:#ffffff; --accent-soft:#e7ebfb;
  --ok:#1d8656; --ok-soft:#e3f4ec; --warn:#a96200; --warn-soft:#fbf0de; --bad:#c03a3a; --bad-soft:#fbe7e7;
  --stamp:#a8344a;
  --tabbar:rgba(248,249,252,.88);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
  --f-data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0e16; --surface:#171a26; --surface-2:#1d2130; --ink:#eef0f8; --muted:#9aa1b8; --line:#2a2f42;
  --accent:#8fa3ff; --accent-ink:#0c0e16; --accent-soft:#1f2645;
  --ok:#5fd19a; --ok-soft:#14301f; --warn:#f0b257; --warn-soft:#33270f; --bad:#ff8a8a; --bad-soft:#3a1717;
  --stamp:#ff8fa3; --tabbar:rgba(20,23,34,.88); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e16; --surface:#171a26; --surface-2:#1d2130; --ink:#eef0f8; --muted:#9aa1b8; --line:#2a2f42;
  --accent:#8fa3ff; --accent-ink:#0c0e16; --accent-soft:#1f2645;
  --ok:#5fd19a; --ok-soft:#14301f; --warn:#f0b257; --warn-soft:#33270f; --bad:#ff8a8a; --bad-soft:#3a1717;
  --stamp:#ff8fa3; --tabbar:rgba(20,23,34,.88); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--f-display);font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:14px 0 4px;text-wrap:balance}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 4px 8px}
.sub{color:var(--muted);font-size:15px;margin:0 0 6px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
.topbar .who{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.iconbtn{border:0;background:var(--accent-soft);color:var(--accent);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}

.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-height:48px}
.row:first-child{border-top:0}
.row .lbl{flex:1;min-width:0}
.row .lbl small{display:block;color:var(--muted);font-size:13px}
.row .val{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.row.tap{cursor:pointer}
.row.tap::after{content:"";width:8px;height:8px;border-right:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg);flex:none;margin-left:2px}
button.row{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left}
.empty{padding:20px 16px;color:var(--muted);font-size:15px;text-align:center}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px 18px 16px;display:grid;gap:14px}
.hero .grade{font-weight:700;font-size:19px;line-height:1.25;text-wrap:balance}
.hero .meta{opacity:.85;font-size:14px}
.hero .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hero .num b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .num span{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.stamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-data);font-size:12px;font-weight:700;letter-spacing:.04em;border:1.5px solid currentColor;border-radius:6px;padding:2px 7px;text-transform:uppercase}
.hero .stamp{color:var(--accent-ink);opacity:.95}

.countdown{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px}
.ring{width:64px;height:64px}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.countdown b{font-size:17px}
.countdown p{margin:2px 0 0;color:var(--muted);font-size:14px}

.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.banner button{margin-left:auto;flex:none}
.note{font-size:13px;color:var(--muted);margin:8px 4px 0;line-height:1.45}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

.timeline{list-style:none;margin:0;padding:6px 0}
.timeline li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 16px;position:relative}
.timeline li::before{content:"";position:absolute;left:29px;top:0;bottom:0;width:2px;background:var(--line)}
.timeline li:first-child::before{top:50%} .timeline li:last-child::before{bottom:50%}
.dot{width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--line);position:relative;z-index:1;justify-self:center}
.timeline li.done .dot{background:var(--muted);border-color:var(--muted)}
.timeline li.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.timeline .t1{font-weight:600}
.timeline .t2{font-size:13px;color:var(--muted)}
.timeline .im{font-family:var(--f-data);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.timeline .im small{display:block;color:var(--ok);font-family:var(--f-ui)}

.bars{display:grid;gap:12px;padding:16px}
.bar .top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px;gap:8px}
.bar .top b{font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex}
.track i{display:block;height:100%}

.payslip{padding:4px 0}
.payslip .row{min-height:40px;padding:9px 16px;font-size:15px}
.payslip .row .val{color:var(--ink);font-family:var(--f-data);font-size:14px}
.payslip .row.minus .val{color:var(--bad)}
.payslip .row.total{background:var(--surface-2);font-weight:700}
.payslip .row.total .val{font-weight:700;font-size:16px}
.net{display:flex;align-items:baseline;justify-content:space-between;padding:18px 16px 6px;gap:12px}
.net b{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.net span{color:var(--muted);font-size:14px}

.btn{border:0;border-radius:12px;padding:12px 16px;font:600 16px/1 var(--f-ui);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1 1 140px}
.add{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;padding:12px 16px;border:0;background:none;font:inherit;font-weight:600;cursor:pointer;width:100%;border-top:1px solid var(--line)}
.group > .add:first-child{border-top:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row.tap:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;cursor:pointer;display:grid;place-items:center;padding:0}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row.faded .lbl{opacity:.5;text-decoration:line-through}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:none;color:var(--muted);font:500 11px/1.2 var(--f-ui);display:grid;justify-items:center;gap:3px;padding:4px 0;cursor:pointer}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-current="page"]{color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:18px 18px 0 0;max-height:92%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet header b{font-size:17px;text-align:center;flex:1}
.sheet header button{border:0;background:none;color:var(--accent);font:inherit;font-size:17px;cursor:pointer;padding:4px}
.sheet header .save{font-weight:700}
.sheet .body{overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.sheet .inner{max-width:620px;margin:0 auto}
.field{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);min-height:48px}
.field:first-child{border-top:0}
.field label{flex:0 0 42%;font-size:15px}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:16px var(--f-ui);text-align:right;padding:4px 0}
.field textarea{text-align:left;resize:vertical;min-height:70px}
.field.col{flex-direction:column;align-items:stretch;gap:6px}
.field.col label{flex:none}
.field.col textarea{border:1px solid var(--line);border-radius:10px;padding:8px;font-family:var(--f-data);font-size:13px}
select{-webkit-appearance:none;appearance:none}
.gridtbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.gridtbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;text-align:left;padding:10px 8px}
.gridtbl td{padding:4px 8px;border-top:1px solid var(--line)}
.gridtbl input{width:100%;border:0;background:var(--surface-2);border-radius:8px;padding:8px;font:15px var(--f-data);color:var(--ink);text-align:right}
.gridtbl input:disabled{background:none;color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}
.gridtbl td:first-child{font-weight:600;width:52px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--ok)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

/* ---------- Utilitaires ---------- */
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pd(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function addMonths(d,m){const r=new Date(d.getFullYear(),d.getMonth()+m,1);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(d.getDate(),last));return r}
function fdate(d,short){if(!d)return"—";if(typeof d==="string")d=pd(d);return d.getDate()+" "+MOIS[d.getMonth()]+(short?"":" "+d.getFullYear())}
function eur(n,dec=2){return (isFinite(n)?n:0).toLocaleString("fr-FR",{minimumFractionDigits:dec,maximumFractionDigits:dec})+" €"}
function num(v,def=0){const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:def}
function daysBetween(a,b){return Math.round((b-a)/864e5)}
function duree(mois){const a=Math.floor(mois/12),m=mois%12;const p=[];if(a)p.push(a+(a>1?" ans":" an"));if(m)p.push(m+" mois");return p.join(" ")||"0 mois"}
function ord(n){return n===1?"1er":n+"e"}
function libE(i,g){const e=(g||gridAt(today()))[i-1];return e&&e.lib?e.lib:ord(i)+" échelon"}
function relDays(n){if(n===0)return"aujourd'hui";if(n===1)return"demain";if(n===-1)return"hier";if(n>0){if(n<60)return"dans "+n+" jours";return"dans "+duree(Math.round(n/30.44))}return"il y a "+(-n<60?-n+" jours":duree(Math.round(-n/30.44)))}

/* Jours fériés (métropole) */
function paques(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
const ferCache={};
function feries(y){if(ferCache[y])return ferCache[y];const p=paques(y),add=n=>{const d=new Date(p);d.setDate(d.getDate()+n);return iso(d)};
  ferCache[y]=new Set([y+"-01-01",add(1),y+"-05-01",y+"-05-08",add(39),add(50),y+"-07-14",y+"-08-15",y+"-11-01",y+"-11-11",y+"-12-25"]);return ferCache[y]}
function joursOuvres(du,au,jps){const a=pd(du),b=pd(au);if(!a||!b||b<a)return[];const out=[];const d=new Date(a);
  while(d<=b){const wd=d.getDay();const ouvre=jps>=6?wd!==0:(wd>=1&&wd<=Math.min(jps,5));if(ouvre&&!feries(d.getFullYear()).has(iso(d)))out.push(new Date(d));d.setDate(d.getDate()+1)}return out}
function nbJours(a,jps){if(a.jours!=null&&a.jours!=="")return num(a.jours);return joursOuvres(a.du,a.au,jps).length}

/* ---------- Stockage : privé par personne (claude.ai) ou local (iPhone) ---------- */
let S=null, store={mode:"local"}, saveT=null;
const LS_KEY="carriere-fpt-v1";
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"null")}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v))}catch(e){}}
async function initStore(){
  const c=window.claude;
  if(c&&typeof c.use==="function"){
    try{
      const timeout=new Promise(r=>setTimeout(()=>r(null),6000));
      const db=await Promise.race([c.use("db"),timeout]);
      const user=db?await Promise.race([c.use("user"),timeout]):null;
      const id=user?await user.id():null;
      if(db&&id){
        const ref=db.collection("data/users/"+id).doc("carriere");
        const snap=await Promise.race([ref.get(),new Promise((_,j)=>setTimeout(()=>j(new Error("délai")),10000))]);
        store={mode:"cloud",ref};
        return snap.exists?snap.data():null;
      }
    }catch(e){/* bascule en local */}
  }
  return lsGet();
}
function save(){
  lsSet(S);
  clearTimeout(saveT);
  if(store.mode==="cloud"){saveT=setTimeout(()=>{store.ref.set(JSON.parse(JSON.stringify(S))).catch(()=>toast("Enregistrement en ligne impossible : copie conservée sur cet appareil"))},700)}
}
function commit(){save();render()}

/* ---------- Calculs métier ---------- */
function carriere(){
  const p=S.profil,t=today(),g=gridAt(t),n=Math.max(1,Math.min(p.echelon,g.length));
  const debut=pd(p.dateEchelon)||today();
  const cur=g[n-1]||{d:null,im:null};
  let prochain=null,prog=1;
  if(cur.d){prochain=addMonths(debut,cur.d);const tot=daysBetween(debut,prochain);prog=Math.max(0,Math.min(1,daysBetween(debut,t)/tot))}
  const futur=[];let d=debut;
  for(let i=n-1;i<g.length;i++){const gi=gridAt(d>t?d:t)[i]||g[i];futur.push({ech:i+1,date:new Date(d),im:gi.im,d:gi.d});if(!gi.d)break;d=addMonths(d,gi.d)}
  const passes=[];for(let i=0;i<n-1;i++)passes.push({ech:i+1,im:g[i].im});
  return {n,cur,debut,prochain,prog,futur,passes,dernier:!cur.d,im:cur.im||0};
}
function anciennete(){const a=pd(S.profil.dateEntree);if(!a)return"—";const t=today();let m=(t.getFullYear()-a.getFullYear())*12+(t.getMonth()-a.getMonth());if(t.getDate()<a.getDate())m--;return duree(Math.max(0,m))}
function paie(imOverride){
  const r=S.remu,q=num(S.profil.quotite,100)/100,pt=pointActuel();
  const im=imOverride!=null?imOverride:carriere().im;
  const ti=im*pt*q, nbi=num(r.nbi)*pt*q, ir=ti*num(r.residence)/100, sft=num(r.sft);
  const primes=(num(r.ifse)+num(r.cia)/12)*q;
  const lignes=Array.isArray(r.lignes)?r.lignes:[];
  const somme=t=>lignes.filter(l=>l.type===t).reduce((a,l)=>a+num(l.montant),0);
  const gainsC=somme("gain"),gainsN=somme("gainNet"),retenues=somme("retenue"),retenuesB=somme("retenueBrut");
  const brut=ti+nbi+ir+sft+primes+gainsC-retenuesB;
  const cnracl=(ti+nbi)*0.111;
  const rafp=Math.min(primes+ir+sft+gainsC,ti*0.20)*0.05;
  const csg=brut*0.9825*0.092, crds=brut*0.9825*0.005;
  const ret=cnracl+rafp+csg+crds;
  const net=brut-ret+gainsN-retenues, pas=(brut-ret)*num(r.pas)/100;
  return {im,ti,nbi,ir,sft,primes,gainsC,gainsN,retenues,retenuesB,lignes,brut,cnracl,rafp,csg,crds,ret,net,pas,netApres:net-pas};
}
function conges(){
  const c=S.conges,jps=num(c.joursSemaine,5),an=num(c.annee,today().getFullYear());
  const droitCA=Math.round(5*jps*10)/10;
  const abs=c.absences.filter(a=>(a.du||"").startsWith(String(an)));
  const pris={CA:0,RTT:0,CET:0,MAL:0,AUT:0};let horsPeriode=0;
  abs.forEach(a=>{pris[a.type]=(pris[a.type]||0)+nbJours(a,jps);
    if(a.type==="CA")joursOuvres(a.du,a.au,jps).forEach(d=>{const m=d.getMonth();if(m<4||m>9)horsPeriode++})});
  const fract=horsPeriode>=8?2:horsPeriode>=5?1:0;
  const totalCA=droitCA+fract+num(c.reportCA);
  return {an,jps,droitCA,fract,horsPeriode,totalCA,pris,restCA:totalCA-pris.CA,rtt:num(c.rtt),restRTT:num(c.rtt)-pris.RTT,cet:num(c.cet),restCET:num(c.cet)-pris.CET,abs};
}

/* ---------- Feuilles de saisie ---------- */
const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim"),sBody=document.getElementById("sheetBody");
let onSave=null,lastFocus=null;
function openSheet(title,html,save,saveLabel="OK"){
  lastFocus=document.activeElement;
  document.getElementById("sheetTitle").textContent=title;
  document.getElementById("sheetSave").textContent=saveLabel;
  sBody.innerHTML=html;onSave=save;
  sheet.hidden=false;scrim.hidden=false;
  requestAnimationFrame(()=>{sheet.classList.add("on");scrim.classList.add("on")});
  setTimeout(()=>{const f=sBody.querySelector("input,select,textarea");if(f&&window.matchMedia("(pointer:fine)").matches)f.focus()},260);
}
function closeSheet(){sheet.classList.remove("on");scrim.classList.remove("on");setTimeout(()=>{sheet.hidden=true;scrim.hidden=true;sBody.innerHTML=""},250);if(lastFocus&&lastFocus.focus)lastFocus.focus()}
document.getElementById("sheetCancel").onclick=closeSheet;scrim.onclick=closeSheet;
document.getElementById("sheetSave").onclick=()=>{if(onSave&&onSave()!==false){closeSheet();commit()}};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet()});
const F=(id,label,value,type="text",extra="")=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${type==="number"?'inputmode="decimal" step="any"':""} ${extra}></div>`;
const SEL=(id,label,value,opts)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(value)?"selected":""}>${esc(l)}</option>`}).join("")}</select></div>`;
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
const del=(label)=>`<div class="btnrow"><button class="btn danger" type="button" id="sheetDel">${label}</button></div>`;
function bindDel(fn){const b=document.getElementById("sheetDel");if(b)b.onclick=()=>{if(b.dataset.armed){fn();closeSheet();commit()}else{b.dataset.armed="1";b.textContent="Toucher à nouveau pour confirmer"}}}

  $("f_cad").onchange=()=>{fill($("f_gra"),gradesOpts($("f_fil").value,$("f_cad").value));sync()};

function sheetGrille(){

  let mode=hasRef&&S.grilleMode!=="perso"?"ref":"perso";

  const read=()=>{tmp=tmp.map((e,i)=>{const d=val("g_d"+i),im=val("g_im"+i);return {...e,d:d===""?null:Math.max(1,parseInt(d)||12),im:im===""?null:parseInt(im)||null}})};

    <p class="note">${mode==="ref"?"Les valeurs grisées viennent de la grille officielle et se mettent à jour automatiquement. Complétez seulement les cases vides.":"Vos valeurs remplacent la grille officielle, qui ne sera plus mise à jour automatiquement."}</p>`:
    `<div class="group">${F("g_nom","Nom de la grille",g.nom)}${SEL("g_tpl","Partir d'une grille officielle","",[["","Choisir…"],...Object.entries(REF.grilles).filter(([k,v])=>v.versions&&v.versions.length).map(([k,v])=>[k,v.nom]).sort((a,b)=>a[1].localeCompare(b[1],"fr"))])}</div>

  <h2>Échelons</h2>

  ${mode==="perso"?`<div style="display:flex;border-top:1px solid var(--line)"><button class="add" type="button" id="g_add" style="border:0">+ Échelon</button><button class="add" type="button" id="g_rem" style="border:0;color:var(--bad)">− Dernier</button></div>`:""}</div>`;
  const wire=()=>{

    if($("g_mode"))$("g_mode").onchange=e=>{read();mode=e.target.value;if(mode==="perso"&&!g.echelons.length)g.echelons=tmp.map(x=>({d:x.d,im:x.im}));load();sBody.innerHTML=body();wire()};
    if($("g_tpl"))$("g_tpl").onchange=e=>{const rg2=REF.grilles[e.target.value],v2=rg2&&versionAt(rg2,t);if(!v2)return;$("g_nom").value=rg2.nom;tmp=v2.echelons.map(x=>({d:x.d,im:x.im,lib:x.lib}));$("g_rows").innerHTML=rows()};

  <h2>Compléments</h2><div class="group">${F("r_nbi","NBI (points)",r.nbi,"number")}${SEL("r_ir","Indemnité de résidence",r.residence,[[0,"Zone 3 · 0 %"],[1,"Zone 2 · 1 %"],[3,"Zone 1 · 3 %"]])}${F("r_sft","Supplément familial (€/mois)",r.sft,"number")}</div>
  <h2>Paramètres</h2><div class="group">${F("r_pt","Valeur du point (€/mois)",pointActuel(),"number")}${F("r_pas","Taux prélèvement à la source (%)",r.pas,"number")}</div>
  <p class="note">La valeur du point suit automatiquement les revalorisations publiées dans les mises à jour de l'app (actuellement 4,92278 € brut mensuel, depuis le 1er juillet 2023). Si vous saisissez une autre valeur, elle n'est plus mise à jour automatiquement.</p>`,()=>{
    Object.assign(r,{ifse:num(val("r_ifse")),cia:num(val("r_cia")),nbi:num(val("r_nbi")),residence:num(val("r_ir")),sft:num(val("r_sft")),point:num(val("r_pt"),POINT_DEFAUT),pas:num(val("r_pas"))});
    const auto=pointAt(today());r.pointAuto=!!auto&&Math.abs(num(val("r_pt"))-auto)<1e-6;toast("Paramètres enregistrés")});
}
function sheetDroits(){
  const c=S.conges;
  openSheet("Droits à congés",`<div class="group">${SEL("d_jps","Jours travaillés par semaine",c.joursSemaine,[[5,"5 jours"],[4.5,"4,5 jours"],[4,"4 jours"],[3,"3 jours"]])}
  ${F("d_rep","Report de congés annuels (jours)",c.reportCA,"number")}${F("d_rtt","RTT de l'année (jours)",c.rtt,"number")}${F("d_cet","Solde CET disponible (jours)",c.cet,"number")}</div>
  <p class="note">Le nombre de RTT dépend du cycle de travail fixé par votre collectivité (par ex. 39 h par semaine ≈ 23 jours, réduits en cas d'absence pour maladie).</p>`,()=>{
    Object.assign(c,{joursSemaine:num(val("d_jps"),5),reportCA:num(val("d_rep")),rtt:num(val("d_rtt")),cet:num(val("d_cet"))});toast("Droits enregistrés")});
}
function sheetAbsence(id){
  const c=S.conges,a=c.absences.find(x=>x.id===id)||{type:"CA",du:iso(today()),au:iso(today()),note:"",jours:""};
  openSheet(id?"Modifier l'absence":"Nouvelle absence",`<div class="group">${SEL("a_type","Type",a.type,Object.entries(TYPES_ABS))}
  ${F("a_du","Du",a.du,"date")}${F("a_au","Au (inclus)",a.au,"date")}${F("a_j","Nombre de jours",a.jours??"","number",'placeholder="auto"')}${F("a_note","Note",a.note||"","text",'placeholder="facultatif"')}</div>
  <p class="note" id="a_calc"></p>${id?del("Supprimer l'absence"):""}`,()=>{
    const du=val("a_du"),au=val("a_au")||du;if(!du){toast("Indiquez la date de début");return false}if(au<du){toast("La date de fin précède la date de début");return false}
    const o={id:a.id||uid(),type:val("a_type"),du,au,note:val("a_note"),jours:val("a_j")===""?null:num(val("a_j"))};
    if(id)Object.assign(a,o);else c.absences.push(o);
    if(!du.startsWith(String(c.annee)))c.annee=parseInt(du.slice(0,4));toast("Absence enregistrée")},id?"OK":"Ajouter");
  const upd=()=>{const n=joursOuvres(val("a_du"),val("a_au")||val("a_du"),num(c.joursSemaine,5)).length;document.getElementById("a_calc").textContent="Calcul automatique : "+fmtJ(n)+" ouvrés (week-ends et jours fériés exclus). Saisissez un nombre pour une demi-journée ou un cas particulier."};
  ["a_du","a_au"].forEach(i=>document.getElementById(i).addEventListener("change",upd));upd();
  bindDel(()=>{c.absences=c.absences.filter(x=>x.id!==id)});
}
function sheetList(kind,id){
  const cfg={
    echeance:{arr:"echeances",t:"Échéance",fields:o=>F("x_titre","Intitulé",o.titre)+F("x_date","Date",o.date||"","date"),
      read:()=>({titre:val("x_titre"),date:val("x_date")}),def:{titre:"",date:"",fait:false}},
    formation:{arr:"formations",t:"Formation",fields:o=>F("x_titre","Intitulé",o.titre)+F("x_org","Organisme",o.organisme||"CNFPT")+F("x_date","Date",o.date||"","date")+F("x_h","Durée (heures)",o.heures??"","number")+SEL("x_type","Type",o.type||"Perfectionnement",["Intégration","Professionnalisation","Perfectionnement","Préparation concours / examen","CPF","Autre"]),
      read:()=>({titre:val("x_titre"),organisme:val("x_org"),date:val("x_date"),heures:num(val("x_h")),type:val("x_type")}),def:{titre:"",organisme:"CNFPT",date:iso(today()),heures:7,type:"Perfectionnement"}},
    journal:{arr:"journal",t:"Arrêté ou événement",fields:o=>F("x_titre","Intitulé",o.titre,"text",'placeholder="ex. Arrêté d\'avancement au 7e échelon"')+F("x_date","Date d'effet",o.date||"","date")+F("x_note","Note",o.note||""),
      read:()=>({titre:val("x_titre"),date:val("x_date"),note:val("x_note")}),def:{titre:"",date:iso(today()),note:""}}
  }[kind];
  const arr=S[cfg.arr],o=arr.find(x=>x.id===id)||{...cfg.def};
  openSheet(id?cfg.t:(kind==="journal"?"Nouvel arrêté ou événement":"Nouvelle "+cfg.t.toLowerCase()),`<div class="group">${cfg.fields(o)}</div>${id?del("Supprimer"):""}`,()=>{
    const r=cfg.read();if(!r.titre){toast("Indiquez un intitulé");return false}
    if(id)Object.assign(o,r);else arr.push({id:uid(),...cfg.def,...r});toast("Enregistré")},id?"OK":"Ajouter");
  bindDel(()=>{S[cfg.arr]=arr.filter(x=>x.id!==id)});
}
function sheetCpf(){
  openSheet("Compte personnel de formation",`<div class="group">${F("c_solde","Solde d'heures",S.cpf.solde,"number")}${SEL("c_maj","Droits majorés",S.cpf.majore?"1":"0",[["0","Non · 25 h/an, plafond 150 h"],["1","Oui · 50 h/an, plafond 400 h"]])}</div>
  <p class="note">Droits majorés : agents de catégorie C sans diplôme de niveau CAP-BEP, ou sur avis du médecin pour prévenir une inaptitude. Votre solde exact est visible sur moncompteformation.gouv.fr.</p>`,()=>{S.cpf={solde:num(val("c_solde")),majore:val("c_maj")==="1"};toast("CPF enregistré")});
}
function sheetImport(){
  openSheet("Importer une sauvegarde",`<div class="group"><div class="field col"><label for="imp_txt">Collez le contenu d'une sauvegarde</label><textarea id="imp_txt" rows="6" placeholder='{"v":1, ...}'></textarea></div></div>
  <div class="btnrow"><button class="btn ghost" type="button" id="imp_file">Choisir un fichier .json</button></div>
  <p class="note">L'import remplace toutes les données actuelles.</p>`,()=>{
    try{const d=JSON.parse(val("imp_txt"));if(!d||!d.profil||!d.grille)throw 0;S=normalise(d);toast("Sauvegarde importée")}catch(e){toast("Ce texte n'est pas une sauvegarde valide");return false}},"Importer");
  document.getElementById("imp_file").onclick=()=>document.getElementById("importFile").click();
}
document.getElementById("importFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const t=document.getElementById("imp_txt");if(t)t.value=rd.result};rd.readAsText(f);e.target.value=""});

async function exporter(){
  const data=JSON.stringify(S,null,2),filename="carriere-fpt-"+iso(today())+".json";
  try{const c=window.claude;const dl=c&&c.use?await c.use("downloads"):null;
    if(dl){await dl.save({filename,data:new Blob([data],{type:"application/json"})});return}}catch(e){if(e&&e.code&&e.code!=="unavailable"){return}}
  if(!window.claude){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=filename;document.body.appendChild(a);a.click();a.remove();return}catch(e){}}
  try{await navigator.clipboard.writeText(data);toast("Sauvegarde copiée dans le presse-papiers")}catch(e){openSheet("Sauvegarde",`<div class="group"><div class="field col"><label for="exp_txt">Copiez ce texte et gardez-le en lieu sûr</label><textarea id="exp_txt" rows="10" readonly>${esc(data)}</textarea></div></div>`,()=>{},"Fermer")}
}

/* ---------- Actions ---------- */
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="profil")sheetProfil();
  else if(a==="demarrer"){S.exemple=false;sheetProfil()}
  else if(a==="grille")sheetGrille();
  else if(a==="remu")sheetRemu();
  else if(a==="droits")sheetDroits();
  else if(a==="absence")sheetAbsence(id);
  else if(a==="echeance"||a==="formation"||a==="journal")sheetList(a,id);
  else if(a==="cpf")sheetCpf();
  else if(a==="ligne")sheetLigne(id);
  else if(a==="fait"){const x=S.echeances.find(z=>z.id===id);if(x){x.fait=!x.fait;commit()}}
  else if(a==="annee"){S.conges.annee=num(S.conges.annee)+num(el.dataset.d);commit()}
  else if(a==="export")exporter();
  else if(a==="import")sheetImport();
  else if(a==="reset"){if(el.dataset.armed){S=vide();commit();sheetProfil()}else{el.dataset.armed="1";el.querySelector(".lbl").textContent="Toucher à nouveau pour tout effacer"}}
});
app.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".tapzone")){e.preventDefault();e.target.click()}});
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;try{sessionStorage.setItem("cfpt-tab",tab)}catch(_){}render();window.scrollTo(0,0)});

let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2200)}

function normalise(d){const base=vide();const o=Object.assign(base,d);
  ["profil","remu","conges","cpf"].forEach(k=>o[k]=Object.assign(vide()[k],d[k]||{}));
  ["formations","echeances","journal"].forEach(k=>o[k]=Array.isArray(d[k])?d[k]:[]);
  if(!Array.isArray(o.conges.absences))o.conges.absences=[];
  if(!o.grilleMode)o.grilleMode=d.profil&&d.profil.grilleRef?"ref":"perso";
  const pr=o.profil;
  if(pr.grilleRef&&!REF.grilles[pr.grilleRef]){pr.grilleRef=null;
    for(const f of REF.filieres)for(const c of f.cadres)for(const g of c.grades)if(!pr.grilleRef&&g.nom.toLowerCase()===String(pr.grade||"").toLowerCase()){pr.grilleRef=g.grille;pr.filiere=f.nom;pr.cadre=c.nom}}
  if(!o.grille||!Array.isArray(o.grille.echelons)||!o.grille.echelons.length)o.grille=vide().grille;
  return o}

/* ---------- Démarrage ---------- */
try{const t=sessionStorage.getItem("cfpt-tab");if(t)tab=t}catch(_){}
S=normalise(lsGet()||exemple());render();
initStore().then(d=>{if(d)S=normalise(d);else if(store.mode==="cloud"){const local=lsGet();S=normalise(local||exemple())}render()});
majRef();
window.__cfpt={paie,carriere,conges,joursOuvres,get S(){return S}};
})();
</script>
